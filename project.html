<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Project</title>
    <link rel="stylesheet" href="project.css">
</head>
<body>

    <div class="calculator">
        <div class="header">
            
            <div class="output">0</div>
            <div class="operation"></div>
            
        </div>
        <div class="center">
            <div class="number" id="row1">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button id="clear">AC</button>
               


                <div class="number" id="row2">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                 <button id="operator">+</button>
               
                </div>

               

                <div class="number" id="row3">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                 <button id="operator">-</button>
                 
                </div>

                <div class="number" id="zero">
                
                    <button>0</button>
                    <button id="equalTo">=</button>
                     <button id="operator">/</button>
                     <button id="operator">*</button>
                </div>


                
            </div>
        </div>
    </div>
     <script src="project.js"></script>
</body>
</html>
